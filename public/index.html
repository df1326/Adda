<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>የቴክኖሎጂ ሽግግር ፕሮፋይል መሰብሰቢያ ፎርም</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #1e293b; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #ffffff; padding: 35px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 420px; margin: 0 auto; }
        .login-card h2 { text-align: center; margin-bottom: 25px; color: #0f172a; font-size: 22px; font-weight: 700; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; background: #fff; }
        .login-btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        .login-btn:hover { background: #1d4ed8; }
        .dashboard { display: none; width: 100%; max-width: 1400px; background: white; padding: 20px; border-radius: 16px; }
        .app-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .app-bar-title { font-size: 18px; font-weight: bold; color: #0f172a; }
        .user-badge { background: #f0fdf4; color: #166534; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; border: 1px solid #bbf7d0; }
        .logout-btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; background: #ef4444; color: white; }
        .toast { position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 400px; margin: 0 auto; background: #0f172a; color: white; padding: 14px 24px; border-radius: 8px; display: none; z-index: 1000; text-align: center; }
    </style>
</head>
<body>

    <!-- የመግቢያ ገጽ -->
    <div class="login-card" id="loginCard">
        <h2>ሪፖርት ሲስተም መግቢያ</h2>
        <div class="form-group">
            <label for="loginRole">ማንነት (Role)</label>
            <select id="loginRole" onchange="toggleLoginFields()">
                <option value="superadmin">ዋና አስተዳዳሪ (Super Admin)</option>
                <option value="admin">አስተዳዳሪ (Admin)</option>
                <option value="user">ሪፖርት የሚሞላ ባለሙያ (User)</option>
            </select>
        </div>
        <div class="form-group" id="usernameGroup" style="display:none;">
            <label for="loginUsername" id="usernameLabel">የሰራተኛ ስም</label>
            <select id="loginUsername"><option value="">በመጀመሪያ ስም ይጫናል...</option></select>
        </div>
        <div class="form-group" id="superAdminUsernameGroup">
            <label for="loginSuperAdminName">የዋና አድሚን ስም</label>
            <input type="text" id="loginSuperAdminName" value="superadmin" readonly>
        </div>
        <div class="form-group">
            <label for="loginPassword">የይለፍ ቃል (Password)</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button class="login-btn" onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> ግባ</button>
    </div>

    <!-- ዳሽቦርድ -->
    <div class="dashboard" id="dashboard">
        <div class="app-bar">
            <div class="app-bar-title">የቴክኖሎጂ ሽግግር ፕሮፋይል መረጃ ቋት</div>
            <span class="user-badge"><i class="fas fa-user-circle"></i> <span id="displayUser">-</span></span>
            <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> ውጣ</button>
        </div>
        <h3>እንኳን ደህና መጡ!</h3>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var API = 'https://adda-1.onrender.com/api';
        var token = localStorage.getItem('token') || '';
        var userRole = localStorage.getItem('userRole') || 'superadmin';

        window.addEventListener('DOMContentLoaded', function() {
            toggleLoginFields();
            if (token) showDashboard();
        });

        function toggleLoginFields() {
            var role = document.getElementById('loginRole').value;
            var usernameGroup = document.getElementById('usernameGroup');
            var superAdminGroup = document.getElementById('superAdminUsernameGroup');
            var usernameLabel = document.getElementById('usernameLabel');

            if (role === 'superadmin') {
                usernameGroup.style.display = 'none';
                superAdminGroup.style.display = 'block';
            } else {
                usernameGroup.style.display = 'block';
                superAdminGroup.style.display = 'none';
                usernameLabel.textContent = role === 'admin' ? 'የአድሚን ስም' : 'የሰራተኛ ስም';
                loadUsersDropdown(role);
            }
        }

        function loadUsersDropdown(role) {
            var select = document.getElementById('loginUsername');
            select.innerHTML = '<option value="">እየጫነ ነው...</option>';

            fetch(API + '/users?role=' + role)
                .then(function(res) {
                    if (!res.ok) throw new Error('Network error');
                    return res.json();
                })
                .then(function(users) {
                    select.innerHTML = role === 'admin' ? '<option value="">አድሚን ይምረጡ...</option>' : '<option value="">ሰራተኛ ይምረጡ...</option>';
                    if (Array.isArray(users) && users.length > 0) {
                        users.forEach(function(u) {
                            var opt = document.createElement('option');
                            opt.value = u.username;
                            opt.textContent = u.username;
                            select.appendChild(opt);
                        });
                    } else {
                        select.innerHTML = '<option value="superadmin">superadmin</option>';
                    }
                })
                .catch(function(err) {
                    console.error('Error fetching users:', err);
                    select.innerHTML = '<option value="superadmin">superadmin</option>';
                    showToast('ተጠቃሚዎችን መጫን አልተቻለም! Render API እየነቃ ሊሆን ይችላል።');
                });
        }

        function handleLogin() {
            var role = document.getElementById('loginRole').value;
            var username = (role === 'superadmin') ? 'superadmin' : document.getElementById('loginUsername').value;
            var password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showToast('እባክዎ መረጃዎችን በትክክል ያስገቡ!');
                return;
            }

            fetch(API + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password, role: role })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    showToast('በተሳካ ሁኔታ ገብተዋል!');
                    showDashboard();
                } else {
                    showToast(data.error || 'የመግቢያ ስህተት!');
                }
            })
            .catch(function() { showToast('ከሰርቨር ጋር መገናኘት አልተቻለም!'); });
        }

        function showDashboard() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('displayUser').textContent = localStorage.getItem('userRole');
        }

        function handleLogout() {
            localStorage.clear();
            location.reload();
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(function() { toast.style.display = 'none'; }, 3500);
        }
    </script>
</body>
</html>

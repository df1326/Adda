<!-- Login Modal -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <img src="https://i.postimg.cc/6Qkn1L6R/photo-2026-07-10-11-32-05.jpg" alt="Logo" class="login-logo">
        
        <h2 style="text-align:center; margin-bottom:1.5rem; color:var(--primary-text);">
            <i class="fas fa-lock"></i> መግቢያ
        </h2>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label><i class="fas fa-user-tag"></i> የተጠቃሚ ዓይነት / ዞን ምረጥ</label>
                <select id="loginUserType" onchange="toggleAdminInput()" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.9rem;">
                    <option value="" disabled selected>-- እባክዎ ዞን/ከተማ ወይም Admin ይምረጡ --</option>
                    
                    <!-- ከተማ አስተዳደሮች -->
                    <option value="ባህር ዳር ከተማ">ባህር ዳር ከተማ</option>
                    <option value="ጎንደር ከተማ">ጎንደር ከተማ</option>
                    <option value="ደብረ ታቦር ከተማ">ደብረ ታቦር ከተማ</option>
                    <option value="ወልድያ ከተማ">ወልድያ ከተማ</option>
                    <option value="ደሴ ከተማ">ደሴ ከተማ</option>
                    <option value="ኮምቦልቻ ከተማ">ኮምቦልቻ ከተማ</option>
                    <option value="ደብረ ብርሃን ከተማ">ደብረ ብርሃን ከተማ</option>
                    <option value="ደብረ ማርቆስ ከተማ">ደብረ ማርቆስ ከተማ</option>
                    
                    <!-- ዞኖች -->
                    <option value="ማዕከላዊ ጎንደር ዞን">ማዕከላዊ ጎንደር ዞን</option>
                    <option value="ምዕራብ ጎንደር ዞን">ምዕራብ ጎንደር ዞን</option>
                    <option value="ሰሜን ጎንደር ዞን">ሰሜን ጎንደር ዞን</option>
                    <option value="ወልቃይት ጠገዴ ስቲት ሁመራ ዞን">ወልቃይት ጠገዴ ስቲት ሁመራ ዞን</option>
                    <option value="ደቡብ ጎንደር ዞን">ደቡብ ጎንደር ዞን</option>
                    <option value="ሰሜን ወሎ ዞን">ሰሜን ወሎ ዞን</option>
                    <option value="ደቡብ ወሎ ዞን">ደቡብ ወሎ ዞን</option>
                    <option value="ሰሜን ሸዋ ዞን">ሰሜን ሸዋ ዞን</option>
                    <option value="ምስራቅ ጎጃም ዞን">ምስራቅ ጎጃም ዞን</option>
                    <option value="ምዕራብ ጎጃም ዞን">ምዕራብ ጎጃም ዞን</option>
                    <option value="ሰሜን ጎጃም">ሰሜን ጎጃም</option>
                    <option value="አዊ ብ/ሰ ዞን">አዊ ብ/ሰ ዞን</option>
                    <option value="ዋግኸምራ ብ/ሰ ዞን">ዋግኸምራ ብ/ሰ ዞን</option>
                    <option value="ኦሮሞ ብ/ሰ ዞን">ኦሮሞ ብ/ሰ ዞን</option>
                    
                    <!-- ለሱፐር አድሚን እና ለቀሩት Adminዎች -->
                    <option value="custom_admin">🔑 Admin / Superadmin (ስም መጻፊያ)</option>
                </select>
            </div>

            <!-- Admin ሲመርጡ ብቻ የሚታይ የስም መጻፊያ ሣጥን -->
            <div class="form-group" id="adminInputGroup" style="margin-bottom: 1rem; display: none;">
                <label><i class="fas fa-user-shield"></i> የ Admin/Superadmin የተጠቃሚ ስም</label>
                <input type="text" id="customAdminUsername" placeholder="የአድሚን ስምዎን ያስገቡ">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label><i class="fas fa-key"></i> የይለፍ ቃል</label>
                <input type="password" id="loginPassword" required placeholder="******">
            </div>

            <button type="submit" class="btn-submit" style="width:100%;">
                <i class="fas fa-sign-in-alt"></i> ይግቡ
            </button>
        </form>
    </div>
</div>

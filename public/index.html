
<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቴክኖሎጂ ሽግግር ክትትል እና አስተዳደር ሲስተም</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nyala&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --brand-blue: #1b365d;      
            --accent-color: #00b4d8;   
            --bg-color: #f0f4f8;       
            --card-bg: #ffffff;        
            --text-main: #0f172a;      
            --text-muted: #475569;     
            --border-color: #cbd5e1;   
            --danger-red: #ef4444;     
            --warning-amber: #d97706;  
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Nyala', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(27, 54, 93, 0.92), rgba(15, 23, 42, 0.95));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            text-align: center;
            border-top: 6px solid var(--accent-color);
        }

        .login-logo {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .login-logo img {
            height: 150px;
            width: 150px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border: 3px solid var(--accent-color);
            background: #ffffff;
            padding: 4px;
        }

        .login-card h2 {
            color: var(--brand-blue);
            margin-bottom: 24px;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--brand-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(27, 54, 93, 0.25);
        }

        .btn-primary:hover {
            background: #0f2347;
        }

        /* Dashboard Layout - kept as requested */
        #dashboardWrapper {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        header {
            background: var(--brand-blue);
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border-bottom: 4px solid var(--accent-color);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-logout {
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn-logout:hover {
            opacity: 0.9;
        }

        main {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .card h3 {
            font-size: 1.15rem;
            margin-bottom: 18px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            padding-bottom: 10px;
            font-weight: 600;
        }

        /* Styling remain as requested in user prompt */
        #createUserCard { background: #f0fdf4; border-top: 5px solid #22c55e; }
        #userListCard { background: #fefce8; border-top: 5px solid #eab308; }
        #superAdminPassCard { background: #faf5ff; border-top: 5px solid #a855f7; }
        #reportFormCard { background: #f8fafc; border-top: 5px solid var(--brand-blue); }

        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            border-top: 5px solid var(--brand-blue);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: var(--brand-blue);
            font-weight: 600;
            border-bottom: 2px solid var(--accent-color);
        }

        #toast {
            visibility: hidden;
            min-width: 260px;
            background-color: var(--brand-blue);
            color: #ffffff;
            text-align: center;
            border-radius: 8px;
            padding: 14px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.95rem;
            border-left: 5px solid var(--accent-color);
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
        }
        
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="loginOverlay">
        <div class="login-card">
            <div class="login-logo">
                <img src="https://i.postimg.cc/6Qkn1L6R/photo-2026-07-10-11-32-05.jpg" alt="የአብክመ ሎጎ">
            </div>
            <h2>እንኳን ደህና መጡ!<br>የቴክኖሎጂ ሽግግር ሪፖርት ማድረጊያ ገጽ</h2>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginRole">ሚና (Role):</label>
                    <select id="loginRole" class="form-control" onchange="toggleLoginInputs()">
                        <option value="user">ዞን / ከተማ ተጠቃሚ (Zone User)</option>
                        <option value="admin">Admin</option>
                        <option value="superadmin">Super Admin</option>
                    </select>
                </div>

                <div class="form-group" id="usernameGroup" style="display:none;">
                    <label for="loginUsername">የተጠቃሚ ስም (Username):</label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="የተጠቃሚ ስም ያስገቡ">
                </div>

                <div class="form-group" id="zoneSelectGroup">
                    <label for="loginZoneSelect">ዞን ይምረጡ:</label>
                    <select id="loginZoneSelect" class="form-control">
                        <option value="ባህር ዳር ከተማ">ባህር ዳር ከተማ</option>
                        <option value="ጎንደር ከተማ">ጎንደር ከተማ</option>
                        <option value="ደብረ ማርቆስ ከተማ">ደብረ ማርቆስ ከተማ</option>
                        <option value="ወልድያ ከተማ">ወልድያ ከተማ</option>
                        <option value="ደሴ ከተማ">ደሴ ከተማ</option>
                        <option value="ኮምቦልቻ ከተማ">ኮምቦልቻ ከተማ</option>
                        <option value="ደብረ ብርሃን ከተማ">ደብረ ብርሃን ከተማ</option>
                        <option value="ደብረ ታቦር ከተማ">ደብረ ታቦር ከተማ</option>
                        <option value="ማዕከላዊ ጎንደር ዞን">ማዕከላዊ ጎንደር ዞን</option>
                        <option value="ምዕራብ ጎንደር ዞን">ምዕራብ ጎንደር ዞን</option>
                        <option value="ሰሜን ጎንደር ዞን">ሰሜን ጎንደር ዞን</option>
                        <option value="ወልቃይት ጠገዴ ሰቲት ሁመራ ዞን">ወልቃይት ጠገዴ ሰቲት ሁመራ ዞን</option>
                        <option value="ደቡብ ጎንደር ዞን">ደቡብ ጎንደር ዞን</option>
                        <option value="ሰሜን ወሎ ዞን">ሰሜን ወሎ ዞን</option>
                        <option value="ደቡብ ወሎ ዞን">ደቡብ ወሎ ዞን</option>
                        <option value="ሰሜን ሸዋ ዞን">ሰሜን ሸዋ ዞን</option>
                        <option value="ምስራቅ ጎጃም ዞን">ምስራቅ ጎጃም ዞን</option>
                        <option value="ምዕራብ ጎጃም ዞን">ምዕራብ ጎጃም ዞን</option>
                        <option value="አዊ ዞን">አዊ ዞን</option>
                        <option value="ኦሮሞ ብ/አ ዞን">ኦሮሞ ብ/አ ዞን</option>
                        <option value="ዋግህምራ ብ/አ ዞን">ዋግህምራ ብ/አ ዞን</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="loginPassword">የይለፍ ቃል (Password):</label>
                    <input type="password" id="loginPassword" class="form-control" required placeholder="የይለፍ ቃል ያስገቡ">
                </div>

                <button type="submit" class="btn-primary">ግባ (Login)</button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard Wrapper -->
    <div id="dashboardWrapper">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="https://i.postimg.cc/6Qkn1L6R/photo-2026-07-10-11-32-05.jpg" alt="የአብክመ ሎጎ" style="height: 48px; width: 48px; object-fit: contain; border-radius: 50%; background: white; padding: 2px; border: 2px solid var(--accent-color);">
                <h1>የቴክኖሎጂ ሽግግር ክትትል ዳሽቦርድ</h1>
            </div>
            <div class="user-info">
                <span id="currentUserDisplay" style="font-weight: 500;">እንግዳ</span>
                <button class="btn-logout" onclick="handleLogout()">ውጣ</button>
            </div>
        </header>
        <!-- ... (Rest of the dashboard content as provided) ... -->
    </div>
</body>
</html>

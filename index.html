<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቴክኖሎጂ ሽግግር ፕሮፋይል መሰብሰቢያ ፎርም</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #1e293b; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; }
        
        .login-card { background: #ffffff; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
        .login-card h2 { text-align: center; margin-bottom: 25px; color: #0f172a; font-size: 22px; font-weight: 700; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .login-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .login-btn:hover { background: #1d4ed8; }

        .dashboard { display: none; width: 100%; max-width: 1500px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .app-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .app-bar-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .app-bar-title { font-size: 20px; font-weight: bold; color: #0f172a; }
        .user-badge { background: #f0fdf4; color: #166534; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid #bbf7d0; }
        .app-bar-actions button { padding: 8px 16px; margin-left: 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; background: #ef4444; color: white; transition: background 0.2s; }
        .app-bar-actions button:hover { background: #dc2626; }
        
        .main-content { display: flex; gap: 20px; flex-wrap: wrap; }
        .form-container { flex: 1; min-width: 320px; background: #f8fafc; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .form-container h3 { margin-bottom: 15px; color: #1e293b; font-size: 16px; font-weight: 700; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .form-grid input, .form-grid select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; font-size: 14px; }
        .form-grid input:focus, .form-grid select:focus { border-color: #3b82f6; outline: none; }
        .submit-btn { grid-column: 1 / -1; padding: 12px; background: #059669; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; transition: background 0.2s; }
        .submit-btn:hover { background: #047857; }
        
        .admin-sidebar { width: 320px; background: #f1f5f9; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; display: none; }
        .admin-sidebar h3 { margin-bottom: 12px; font-size: 16px; color: #1e293b; border-bottom: 1px solid #cbd5e1; padding-bottom: 5px; }
        .user-list { list-style: none; margin-bottom: 15px; max-height: 150px; overflow-y: auto; }
        .user-list li { display: flex; justify-content: space-between; align-items: center; background: white; padding: 8px 12px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 14px; font-weight: 500; }
        .user-list li span.role-tag { font-size: 11px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: #475569; }
        .user-list li button { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; }

        .super-password-box { background: #fff; padding: 15px; border-radius: 8px; border: 1px dashed #10b981; margin-top: 20px; }
        .super-password-box h4 { font-size: 14px; color: #047857; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }

        .table-container { width: 100%; overflow-x: auto; margin-top: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 12px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px; border: 1px solid #e2e8f0; text-align: center; white-space: nowrap; }
        th { background: #f8fafc; color: #334155; font-weight: 700; font-size: 13px; }
        tr:nth-child(even) { background: #f8fafc; }
        tr:hover { background: #f1f5f9; }
        .action-del { color: #ef4444; cursor: pointer; border: none; background: none; font-size: 15px; }
        .action-del:hover { color: #dc2626; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: white; padding: 14px 28px; border-radius: 8px; display: none; z-index: 1000; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); font-weight: 500; }
        
        @media (max-width: 768px) {
            .app-bar-left { flex-direction: column; align-items: flex-start; }
            .admin-sidebar { width: 100%; }
            .form-container { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="login-card" id="loginCard">
        <h2>ሪፖርት ሲስተም መግቢያ</h2>
        <div class="form-group">
            <label>ማንነት (Role)</label>
            <select id="loginRole" onchange="toggleLoginFields()">
                <option value="superadmin">ዋና አስተዳዳሪ (Super Admin)</option>
                <option value="admin">አስተዳዳሪ (Admin)</option>
                <option value="user">ሪፖርት የሚሞላ ባለሙያ (User)</option>
            </select>
        </div>
        
        <div class="form-group" id="usernameGroup" style="display:none;">
            <label id="usernameLabel">የሰራተኛ ስም</label>
            <select id="loginUsername">
                <option value="">በመጀመሪያ ስም ይጫናሉ...</option>
            </select>
        </div>

        <div class="form-group" id="superAdminUsernameGroup">
            <label>የዋና አድሚን ስም</label>
            <input type="text" id="loginSuperAdminName" value="superadmin" readonly>
        </div>
        <div class="form-group">
            <label>የይለፍ ቃል (Password)</label>
            <input type="password" id="loginPassword" placeholder="******" required>
        </div>
        <button class="login-btn" onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> ግባ</button>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="app-bar">
            <div class="app-bar-left">
                <div class="app-bar-title">የቴክኖሎጂ ሽግግር ፕሮፋይል መረጃ ቋት</div>
                <span class="user-badge"><i class="fas fa-user-circle"></i> &nbsp;<span id="displayUser">-</span></span>
            </div>
            <div class="app-bar-actions">
                <button onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> ውጣ</button>
            </div>
        </div>

        <div class="main-content">
            <div class="form-container" id="formContainer">
                <h3>አዲስ የሪፖርት መረጃ መሙያ ሳጥን</h3>
                <form id="reportForm" onsubmit="saveReport(event)">
                    <div class="form-grid">
                        <input type="text" id="zone" placeholder="ዞን/ከተማ መምሪያ" required />
                        <input type="text" id="poly" placeholder="ፖሊ/ኮሌጅ" required />
                        <input type="text" id="techName" placeholder="የቴክኖሎጂው ስም" required />
                        <input type="text" id="coordinator" placeholder="የቴክኖሎጂ ዘርፍ አስተባባሪ ስም" required />
                        <input type="tel" id="phone" placeholder="ስልክ ቁጥር (09...)" required />
                        <input type="text" id="sector" placeholder="የቴክኖሎጂው ዘርፍ" required />
                        <select id="valueChain" required>
                            <option value="">እሴት ሰንሰለት ሰነድ...</option>
                            <option value="አለው">አለው</option>
                            <option value="የለውም">የለውም</option>
                        </select>
                        <input type="text" id="techType" placeholder="ቴክኖሎጂው የሚፈታው ችግር ባጭሩ" required />
                        <input type="text" id="year" placeholder="የተሸጋገረበት ዓ/ም" required />
                        <input type="number" min="0" id="transferQty" placeholder="ሽግግር በብዛት" required />
                        <input type="text" id="transferSector" placeholder="የተሸጋገረበት ዘርፍ" required />
                        <input type="number" min="0" id="resource" placeholder="የተፈራ ሃብት (በብር)" required />
                        
                        <input type="number" min="0" id="b_ent" placeholder="ተጠቃሚ (ኢ/ዝ)" required />
                        <input type="number" min="0" id="b_mobile" placeholder="ተጠቃሚ (አንቀ)" required />
                        <input type="number" min="0" id="b_male" placeholder="ተጠቃሚ (ወ)" required />
                        <input type="number" min="0" id="b_female" placeholder="ተጠቃሚ (ሴ)" required />
                        <input type="number" min="0" id="diagnosis" placeholder="ተጠቃሚ (ድ)" required />
                        
                        <button type="submit" id="saveBtn" class="submit-btn"><i class="fas fa-save"></i> &nbsp;መረጃውን በቋሚነት መዝግብ</button>
                    </div>
                </form>
            </div>

            <div class="admin-sidebar" id="adminSidebar">
                <h3 id="sidebarTitle">አካውንቶች ማስተዳደሪያ</h3>
                <ul class="user-list" id="userListUI"></ul>
                
                <div id="adminActionFields">
                    <div style="margin-bottom: 8px;">
                        <select id="newUserRole" style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px;">
                            <option value="user">ሪፖርት የሚሞላ (User)</option>
                            <option value="admin">አስተዳዳሪ (Admin)</option>
                        </select>
                    </div>
                    <input type="text" id="newUserName" placeholder="አዲስ የተጠቃሚው ስም (Username)" style="width:100%; padding:9px; margin-bottom:8px; border:1px solid #cbd5e1; border-radius:6px;" />
                    <input type="password" id="newUserPassword" placeholder="የይለፍ ቃል (Password)" style="width:100%; padding:9px; margin-bottom:12px; border:1px solid #cbd5e1; border-radius:6px;" />
                    <button onclick="createUser()" style="width:100%; padding:10px; background:#10b981; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-bottom:15px;"><i class="fas fa-user-plus"></i> አካውንት ፍጠር</button>
                </div>

                <div class="super-password-box" id="superPasswordSection" style="display:none;">
                    <h4><i class="fas fa-key"></i> የሱፐር አድሚን ይለፍ ቃል ቀይር</h4>
                    <input type="password" id="oldSuperPwd" placeholder="የድሮው የይለፍ ቃል" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px;" />
                    <input type="password" id="newSuperPwd" placeholder="አዲስ የይለፍ ቃል (ቢያንስ 6)" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #cbd5e1; border-radius:6px; font-size:13px;" />
                    <button onclick="submitChangePassword()" style="width:100%; padding:8px; background:#2563eb; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;">ለውጡን መዝግብ</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="reportTable">
                <thead>
                    <tr>
                        <th>ዞን/ከተማ</th><th>ፖሊ/ኮሌጅ</th><th>የቴክኖሎጂው ስም</th>
                        <th>አስተባባሪ</th><th>ስልክ</th><th>ዘርፍ</th>
                        <th>እሴት ሰንሰለት</th><th>ችግር ፈቺነቱ</th><th>ዓ/ም</th>
                        <th>በብዛት</th><th>የተሸጋገረበት ዘርፍ</th><th>ሃብት (ብር)</th>
                        <th>ተጠቃሚ (ኢ/ዝ)</th><th>ተጠቃሚ (አንቀ)</th><th>ተጠቃሚ (ወ)</th>
                        <th>ተጠቃሚ (ሴ)</th><th>ተጠቃሚ (ድ)</th><th>መዝጋቢ</th><th>ድርጊት</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // API URL - በአካባቢው መሰረት የሚለወጥ
        // ============================================================
        // ለNetlify (Render ሰርቨር ይጠቀማል)
        const API = 'https://adda-1.onrender.com/api';
        
        // ለአካባቢዊ (Local) ሙከራ - አስተያየት ያስወግዱ
        // const API = 'http://localhost:3000/api';

        let token = localStorage.getItem('token') || '';
        let userRole = localStorage.getItem('userRole') || 'superadmin';
        let loggedInUsername = localStorage.getItem('username') || '';

        console.log('🌐 API URL:', API);
        console.log('🔑 Token exists:', !!token);
        console.log('👤 User role:', userRole);

        // ============================================================
        // ገጹ ሲጫን የሚሰራ
        // ============================================================
        window.onload = function() {
            console.log('📱 Page loaded');
            toggleLoginFields();
            if (token) { 
                console.log('🔑 Token found, showing dashboard');
                showDashboard(); 
            }
            initializeSuperAdmin();
        };

        // ============================================================
        // ሱፐር አድሚን ማስጀመሪያ
        // ============================================================
        async function initializeSuperAdmin() {
            try {
                console.log('🔄 Initializing superadmin...');
                const res = await fetch(`${API}/init-superadmin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                console.log('✅ Superadmin init:', data.message);
            } catch(e) {
                console.log('⚠️ Superadmin initialization check failed:', e);
            }
        }

        // ============================================================
        // የመግቢያ መስኮችን መቀየር
        // ============================================================
        function toggleLoginFields() {
            const role = document.getElementById('loginRole').value;
            const usernameGroup = document.getElementById('usernameGroup');
            const superAdminGroup = document.getElementById('superAdminUsernameGroup');
            const usernameLabel = document.getElementById('usernameLabel');

            console.log('🔄 Role changed to:', role);

            if (role === 'superadmin') {
                usernameGroup.style.display = 'none';
                superAdminGroup.style.display = 'block';
                // ለሱፐር አድሚን ነባሪ ስም ያስቀምጡ
                document.getElementById('loginUsername').value = 'superadmin';
                // የይለፍ ቃል መስክ ላይ አትኩሮት
                document.getElementById('loginPassword').focus();
            } else {
                usernameGroup.style.display = 'block';
                superAdminGroup.style.display = 'none';
                usernameLabel.innerText = role === 'admin' ? 'የአድሚን ስም' : 'የሰራተኛ ስም';
                loadUsersDropdown(role);
            }
        }

        // ============================================================
        // ተጠቃሚዎችን መጫን
        // ============================================================
        async function loadUsersDropdown(role) {
            if (role === 'superadmin') return;

            try {
                console.log('📋 Loading users for role:', role);
                console.log('🌐 Fetching from:', `${API}/users?role=${role}`);
                
                const res = await fetch(`${API}/users?role=${role}`);
                console.log('📊 Response status:', res.status);
                
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error('❌ Error response:', errorText);
                    throw new Error('ለተጠቃሚዎች ጥሪ አልተሳካም');
                }
                
                const users = await res.json();
                console.log('✅ Users loaded:', users);
                
                const select = document.getElementById('loginUsername');
                
                if (role === 'admin') {
                    select.innerHTML = '<option value="">አድሚን ይምረጡ...</option>';
                } else {
                    select.innerHTML = '<option value="">ሰራተኛ ይምረጡ...</option>';
                }
                
                if (users && users.length > 0) {
                    users.forEach(u => {
                        select.innerHTML += `<option value="${u.username}">${u.username}</option>`;
                    });
                    console.log('✅ Added users to dropdown:', users.length);
                } else {
                    console.warn('⚠️ No users found for role:', role);
                    // ተጠቃሚዎች ከሌሉ ነባሪ አማራጭ ያክሉ
                    select.innerHTML += `<option value="superadmin">superadmin</option>`;
                }

                // ለአድሚን ሳይድባር ተጠቃሚዎችን መጫን
                if(token && (userRole === 'superadmin' || userRole === 'admin')) {
                    const allRes = await fetch(`${API}/users`, { 
                        headers: { 'Authorization': `Bearer ${token}` } 
                    });
                    if(allRes.ok) {
                        const allUsers = await allRes.json();
                        loadAdminUsersList(allUsers);
                    }
                }
            } catch(e) {
                console.error("❌ Users load error:", e);
                // ስህተት ካለ ነባሪ አማራጭ ያክሉ
                const select = document.getElementById('loginUsername');
                select.innerHTML = '<option value="superadmin">superadmin</option>';
                showToast('ተጠቃሚዎችን መጫን አልተቻለም! ነባሪ አካውንት ይጠቀሙ');
            }
        }

        // ============================================================
        // መግቢያን ማስተናገድ
        // ============================================================
        async function handleLogin() {
            const role = document.getElementById('loginRole').value;
            let username = (role === 'superadmin') ? 'superadmin' : document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value.trim();

            console.log('🔑 Login attempt:', { username, role });

            if(!username || !password) return showToast('እባክዎ መረጃዎችን በትክክል ያስገቡ!');

            try {
                console.log('🌐 Sending login to:', `${API}/login`);
                
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                console.log('📊 Login response status:', res.status);
                const data = await res.json();
                console.log('📊 Login response:', data);

                if(res.ok) {
                    token = data.token;
                    userRole = data.role;
                    loggedInUsername = username;
                    localStorage.setItem('token', token);
                    localStorage.setItem('userRole', userRole);
                    localStorage.setItem('username', loggedInUsername);
                    showToast('በተሳካ ሁኔታ ገብተዋል!');
                    showDashboard();
                } else {
                    showToast(data.error || 'የመግቢያ መረጃው የተሳሳተ ነው!');
                }
            } catch(e) {
                console.error('❌ Login error:', e);
                showToast('ከሰርቨር ጋር መገናኘት አልተቻለም!');
            }
        }

        // ============================================================
        // ዳሽቦርድ ማሳየት
        // ============================================================
        function showDashboard() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('displayUser').innerText = `${loggedInUsername} (${userRole})`;
            
            if(userRole === 'superadmin') {
                document.getElementById('adminSidebar').style.display = 'block';
                document.getElementById('sidebarTitle').innerText = "አካውንቶች ማስተዳደሪያ (Super Admin)";
                document.getElementById('adminActionFields').style.display = 'block';
                document.getElementById('superPasswordSection').style.display = 'block';
                document.getElementById('formContainer').style.display = 'none';
            } else if (userRole === 'admin') {
                document.getElementById('adminSidebar').style.display = 'block';
                document.getElementById('sidebarTitle').innerText = "የአካውንቶች ዝርዝር (Admin View)";
                document.getElementById('adminActionFields').style.display = 'none';
                document.getElementById('superPasswordSection').style.display = 'none';
                document.getElementById('formContainer').style.display = 'none';
            } else {
                document.getElementById('adminSidebar').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';
            }
            loadUsersDropdown(userRole);
            loadReports();
        }

        // ============================================================
        // ሪፖርት ማስቀመጥ
        // ============================================================
        async function saveReport(event) {
            event.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> በመመዝገብ ላይ...';

            const reportData = {
                zone: document.getElementById('zone').value.trim(),
                poly: document.getElementById('poly').value.trim(),
                techName: document.getElementById('techName').value.trim(),
                coordinator: document.getElementById('coordinator').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                sector: document.getElementById('sector').value.trim(),
                valueChain: document.getElementById('valueChain').value,
                techType: document.getElementById('techType').value.trim(),
                year: document.getElementById('year').value.trim(),
                transferQty: parseInt(document.getElementById('transferQty').value) || 0,
                transferSector: document.getElementById('transferSector').value.trim(),
                resource: parseFloat(document.getElementById('resource').value) || 0,
                b_ent: parseInt(document.getElementById('b_ent').value) || 0,
                b_mobile: parseInt(document.getElementById('b_mobile').value) || 0,
                b_male: parseInt(document.getElementById('b_male').value) || 0,
                b_female: parseInt(document.getElementById('b_female').value) || 0,
                diagnosis: parseInt(document.getElementById('diagnosis').value) || 0
            };

            try {
                const res = await fetch(`${API}/report`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify(reportData)
                });

                const data = await res.json();
                if(res.ok) {
                    showToast('መረጃው ተመዝግቧል!');
                    document.getElementById('reportForm').reset();
                    loadReports();
                } else {
                    showToast(data.error || 'መረጃ መዝገብ አልተቻለም!');
                }
            } catch(e) {
                showToast('መረጃ መዝገብ አልተቻለም!');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> &nbsp;መረጃውን በቋሚነት መዝግብ';
            }
        }

        // ============================================================
        // ሪፖርቶችን መጫን
        // ============================================================
        async function loadReports() {
            try {
                const res = await fetch(`${API}/report`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                const data = await res.json();
                const tbody = document.getElementById('reportTableBody');
                tbody.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="19">ምንም የተመዘገበ መረጃ አልተገኘም።</td></tr>';
                    return;
                }
                
                data.forEach(row => {
                    const deleteBtn = (userRole === 'superadmin') ? 
                        `<button class="action-del" onclick="deleteReport(${row.id})"><i class="fas fa-trash"></i></button>` : 
                        '<span style="color:#94a3b8;">-</span>';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>${row.zone || ''}</td><td>${row.poly || ''}</td><td>${row.techName || ''}</td>
                            <td>${row.coordinator || ''}</td><td>${row.phone || ''}</td><td>${row.sector || ''}</td>
                            <td>${row.valueChain || ''}</td><td>${row.techType || ''}</td><td>${row.year || ''}</td>
                            <td>${row.transferQty || 0}</td><td>${row.transferSector || ''}</td><td>${row.resource || 0}</td>
                            <td>${row.b_ent || 0}</td><td>${row.b_mobile || 0}</td><td>${row.b_male || 0}</td>
                            <td>${row.b_female || 0}</td><td>${row.diagnosis || 0}</td>
                            <td><b>${row.enteredBy || '-'}</b></td><td>${deleteBtn}</td>
                        </tr>`;
                });
            } catch(e) {
                console.error("Load reports error:", e);
            }
        }

        // ============================================================
        // ሪፖርት መሰረዝ
        // ============================================================
        async function deleteReport(id) {
            if(userRole !== 'superadmin') return showToast('ሱፐር አድሚን ብቻ መረጃ መሰረዝ ይችላል!');
            if(!confirm('እርግጠኛ ነህ ይህንን መረጃ ማጥፋት ትፈልጋለህ?')) return;
            
            try {
                const res = await fetch(`${API}/report/${id}`, { 
                    method: 'DELETE', 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                
                if(res.ok) { 
                    showToast('መረጃው ተሰርዟል!'); 
                    loadReports(); 
                } else { 
                    const err = await res.json(); 
                    showToast(err.error || 'ማጥፋት አልተቻለም'); 
                }
            } catch(e) {
                showToast('መረጃውን ማጥፋት አልተቻለም!');
            }
        }

        // ============================================================
        // አዲስ ተጠቃሚ መፍጠር
        // ============================================================
        async function createUser() {
            if(userRole !== 'superadmin') return showToast('ሱፐር አድሚን ብቻ አካውንት መፍጠር ይችላል!');
            
            const role = document.getElementById('newUserRole').value;
            const username = document.getElementById('newUserName').value.trim();
            const password = document.getElementById('newUserPassword').value.trim();
            
            if(!username || !password) return showToast('እባክዎ ስምና ፓስዎርድ ያስገቡ!');
            if(password.length < 6) return showToast('የይለፍ ቃል ቢያንስ 6 ቁምፊዎች መሆን አለበት!');

            try {
                const res = await fetch(`${API}/users`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ username, password, role })
                });

                const data = await res.json();
                if(res.ok) {
                    const roleText = role === 'admin' ? 'አድሚን' : 'ሰራተኛ';
                    showToast(`አዲስ ${roleText} '${username}' ተፈጥሯል!`);
                    document.getElementById('newUserName').value = '';
                    document.getElementById('newUserPassword').value = '';
                    loadUsersDropdown(userRole);
                } else {
                    showToast(data.error || 'ተጠቃሚ መፍጠር አልተቻለም');
                }
            } catch(e) {
                showToast('ተጠቃሚ መፍጠር አልተቻለም!');
            }
        }

        // ============================================================
        // የአድሚን ተጠቃሚዎች ዝርዝር መጫን
        // ============================================================
        function loadAdminUsersList(users) {
            const ul = document.getElementById('userListUI');
            ul.innerHTML = '';
            if(!Array.isArray(users)) return;

            users.forEach(u => {
                const delUserBtn = (userRole === 'superadmin' && u.username !== 'superadmin') ? 
                    `<button onclick="deleteUser('${u.username}')"><i class="fas fa-user-minus"></i></button>` : 
                    '';
                ul.innerHTML += `<li><span>${u.username}</span> <span class="role-tag">${u.role}</span> ${delUserBtn}</li>`;
            });
        }

        // ============================================================
        // ተጠቃሚ መሰረዝ
        // ============================================================
        async function deleteUser(name) {
            if(userRole !== 'superadmin') return showToast('ሱፐር አድሚን ብቻ ተጠቃሚ መሰረዝ ይችላል!');
            if(name === 'superadmin') return showToast('የሱፐር አድሚን አካውንት መሰረዝ አይቻልም!');
            if(!confirm(`ተጠቃሚ '${name}' እንዲጠፋ ትፈልጋለህ?`)) return;
            
            try {
                const res = await fetch(`${API}/users/${name}`, { 
                    method: 'DELETE', 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                
                if(res.ok) { 
                    showToast('ተጠቃሚው ተሰርዟል!'); 
                    loadUsersDropdown(userRole);
                } else { 
                    const err = await res.json(); 
                    showToast(err.error || 'ማጥፋት አልተቻለም'); 
                }
            } catch(e) {
                showToast('ተጠቃሚውን ማጥፋት አልተቻለም!');
            }
        }

        // ============================================================
        // ሱፐር አድሚን ይለፍ ቃል መቀየር
        // ============================================================
        async function submitChangePassword() {
            const currentPassword = document.getElementById('oldSuperPwd').value.trim();
            const newPassword = document.getElementById('newSuperPwd').value.trim();

            if(!currentPassword || !newPassword) return showToast('እባክዎ ሁለቱንም የይለፍ ቃላት ያስገቡ!');
            if(newPassword.length < 6) return showToast('አዲሱ የይለፍ ቃል ቢያንስ 6 ቁምፊዎች መሆን አለበት!');

            try {
                const res = await fetch(`${API}/superadmin/change-password`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                const data = await res.json();
                if(res.ok) {
                    showToast('የሱፐር አድሚን ይለፍ ቃል ተቀይሯል!');
                    document.getElementById('oldSuperPwd').value = '';
                    document.getElementById('newSuperPwd').value = '';
                } else {
                    showToast(data.error || 'ስህተት ተከሰቷል!');
                }
            } catch(e) {
                showToast('ከሰርቨር ጋር መገናኘት አልተቻለም!');
            }
        }

        // ============================================================
        // መውጣት
        // ============================================================
        function handleLogout() {
            localStorage.clear();
            location.reload();
        }

        // ============================================================
        // መልእክት ማሳየት
        // ============================================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3500);
        }

        // ገጹ ሲጫን ተጨማሪ ማረጋገጫ
        console.log('✅ Application loaded successfully');
        console.log('📝 To login, use: superadmin / admin123');
    </script>
</body>
</html>

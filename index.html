<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የቴክኖሎጂ ሽግግር ክትትል እና አስተዳደር ሲስተም</title>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1, h2, h3 { color: var(--primary); margin-bottom: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #475569; }
        input, select, textarea { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        button { background-color: var(--secondary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background-color: var(--primary); }
        .table-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { border: 1px solid var(--border); padding: 8px 12px; }
        th { background-color: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #f1f5f9; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 12px 20px; border-radius: 6px; display: none; z-index: 1000; }
        .hidden { display: none !important; }
        .action-del { background-color: var(--danger); padding: 5px 10px; font-size: 12px; }
        .action-reset { background-color: #f59e0b; padding: 5px 10px; font-size: 12px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="loginCard" class="card" style="max-width: 400px; margin: 100px auto;">
            <h2>ግባ (Login)</h2>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>የተጠቃሚ ስም (Username)</label>
                <input type="text" id="loginUser" placeholder="የተጠቃሚ ስም ያስገቡ">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>የይለፍ ቃል (Password)</label>
                <input type="password" id="loginPass" placeholder="የይለፍ ቃል ያስገቡ">
            </div>
            <button onclick="handleLogin()" style="width: 100%;">ግባ</button>
        </div>

        <!-- Main Dashboard -->
        <div id="mainDashboard" class="hidden">
            <div class="header-flex">
                <h1 id="welcomeTitle">የቴክኖሎጂ ሽግግር ዳሽቦርድ</h1>
                <button onclick="handleLogout()" style="background-color: var(--danger);">ውጣ (Logout)</button>
            </div>

            <!-- Report Submission Form -->
            <div class="card">
                <h2>አዲስ የቴክኖሎጂ ሽግግር ሪፖርት መመዝገቢያ</h2>
                <form id="reportForm" onsubmit="handleReportSubmit(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>ዞን/ከተማ አስተዳደር</label>
                            <input type="text" id="zone" required>
                        </div>
                        <div class="form-group">
                            <label>ፖሊቴክኒክ ኮሌጅ</label>
                            <input type="text" id="poly" required>
                        </div>
                        <div class="form-group">
                            <label>የቴክኖሎጂው ስም</label>
                            <input type="text" id="techName" required>
                        </div>
                        <div class="form-group">
                            <label> አስተባባሪ ስም</label>
                            <input type="text" id="coordinator">
                        </div>
                        <div class="form-group">
                            <label>ስልክ ቁጥር</label>
                            <input type="text" id="phone">
                        </div>
                        <div class="form-group">
                            <label>ዘርፍ (Sector)</label>
                            <input type="text" id="sector">
                        </div>
                        <div class="form-group">
                            <label>እሴት ሰንሰለት (Value Chain)</label>
                            <input type="text" id="valueChain">
                        </div>
                        <div class="form-group">
                            <label>የቴክኖሎጂ ዓይነት</label>
                            <input type="text" id="techType">
                        </div>
                        <div class="form-group">
                            <label>ዓመተ ምህረት</label>
                            <input type="text" id="year">
                        </div>
                        <div class="form-group">
                            <label>የተላለፈው ብዛት</label>
                            <input type="number" id="transferQty">
                        </div>
                        <div class="form-group">
                            <label>የተላለፈበት ሴክተር</label>
                            <input type="text" id="transferSector">
                        </div>
                        <div class="form-group">
                            <label>በጀት / ግብዓት</label>
                            <input type="text" id="resource">
                        </div>
                        <div class="form-group">
                            <label>ተጠቃሚ ድርጅቶች ብዛት</label>
                            <input type="number" id="b_ent" value="0">
                        </div>
                        <div class="form-group">
                            <label>ተጠቃሚ ማክሮ/ሞባይል ድርጅቶች</label>
                            <input type="number" id="b_mobile" value="0">
                        </div>
                        <div class="form-group">
                            <label>ተጠቃሚ ወንድ ብዛት</label>
                            <input type="number" id="b_male" value="0">
                        </div>
                        <div class="form-group">
                            <label>ተጠቃሚ ሴት ብዛት</label>
                            <input type="number" id="b_female" value="0">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>የችግር ዳያግኖስቲክስ / ማስታወሻ</label>
                            <textarea id="diagnosis" rows="2"></textarea>
                        </div>
                    </div>
                    <button type="submit">ሪፖርት መዝግብ</button>
                </form>
            </div>

            <!-- Admin Panel (Visible for superadmin/admin) -->
            <div id="adminPanel" class="card hidden">
                <h2>የአስተዳዳሪ ማዕከል (User Management)</h2>
                <div class="form-grid" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label>አዲስ ተጠቃሚ ስም</label>
                        <input type="text" id="newUserName">
                    </div>
                    <div class="form-group">
                        <label>የይለፍ ቃል</label>
                        <input type="password" id="newUserPassword">
                    </div>
                    <div class="form-group">
                        <label>ሚና (Role)</label>
                        <select id="newUserRole">
                            <option value="user">User (ተጠቃሚ)</option>
                            <option value="admin">Admin (አስተዳዳሪ)</option>
                        </select>
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button type="button" onclick="createUser()">ተጠቃሚ ፍጠር</button>
                    </div>
                </div>
                <h3>የተጠቃሚዎች ዝርዝር</h3>
                <ul id="userListUI" style="list-style: none; margin-top: 10px;"></ul>
                
                <h3 style="margin-top: 20px;">የይለፍ ቃል መቀየሪያ</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>የድሮ የይለፍ ቃል</label>
                        <input type="password" id="oldSuperPwd">
                    </div>
                    <div class="form-group">
                        <label>አዲስ የይለፍ ቃል</label>
                        <input type="password" id="newSuperPwd">
                    </div>
                    <div class="form-group" style="justify-content: flex-end;">
                        <button type="button" onclick="submitChangePassword()">ቀይር</button>
                    </div>
                </div>
            </div>

            <!-- Reports View Section -->
            <div class="card">
                <div class="header-flex">
                    <h2>የተመዘገቡ ሪፖርቶች</h2>
                    <button onclick="exportTableToExcel()" style="background-color: var(--success);">ወደ ኤክሴል አውርድ (Export)</button>
                </div>
                <div class="table-container">
                    <table id="reportTable">
                        <thead>
                            <tr>
                                <th>ዞን</th>
                                <th>ኮሌጅ</th>
                                <th>ቴክኖሎጂ</th>
                                <th>አስተባባሪ</th>
                                <th>ስልክ</th>
                                <th>ዘርፍ</th>
                                <th>እሴት ሰንሰለት</th>
                                <th>ዓይነት</th>
                                <th>ዓመት</th>
                                <th>ብዛት</th>
                                <th>የተላለፈበት ሴክተር</th>
                                <th>ግብዓት</th>
                                <th>ድርጅቶች</th>
                                <th>ሞባይል</th>
                                <th>ወንድ</th>
                                <th>ሴት</th>
                                <th>ዳያግኖስቲክስ</th>
                                <th>የመዘገበው</th>
                                <th>እርምጃ</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <!-- Dynamic rows go here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">ማሳሰቢያ</div>

    <script>
        const API = 'http://localhost:5000/api'; // የሰርቨር ማገናኛ አድራሻዎ
        let token = localStorage.getItem('token') || '';
        let userRole = localStorage.getItem('role') || '';
        let currentUser = localStorage.getItem('username') || '';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = function() {
            if (token) {
                showDashboard();
            }
        };

        function handleLogin() {
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();

            if (!username || !password) {
                showToast('እባክዎ የተጠቃሚ ስም እና የይለፍ ቃል ያስገቡ!');
                return;
            }

            fetch(API + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json().then(d => ({ ok: res.ok, data: d })))
            .then(result => {
                if (result.ok) {
                    token = result.data.token;
                    userRole = result.data.role;
                    currentUser = username;
                    localStorage.setItem('token', token);
                    localStorage.setItem('role', userRole);
                    localStorage.setItem('username', currentUser);
                    showDashboard();
                    showToast('በተሳካ ሁኔታ ገብተዋል!');
                } else {
                    showToast(result.data.error || 'መግባት አልተቻለም!');
                }
            }).catch(err => {
                showToast('ሰርቨር ጋር መገናኘት አልተቻለም!');
            });
        }

        function handleLogout() {
            localStorage.clear();
            token = '';
            userRole = '';
            currentUser = '';
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            showToast('ውጣ ተከናውኗል!');
        }

        function showDashboard() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('welcomeTitle').innerText = `የቴክኖሎጂ ሽግግር ዳሽቦርድ - (${currentUser})`;

            if (userRole === 'superadmin' || userRole === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
                fetchAdminUsersList();
            }
            loadReports();
        }

        function fetchAdminUsersList() {
            fetch(API + '/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(users => {
                const userListUI = document.getElementById('userListUI');
                userListUI.innerHTML = '';
                if (!users || users.length === 0) {
                    userListUI.innerHTML = '<li style="color:#64748b;">ምንም ተጠቃሚ የለም</li>';
                    return;
                }
                users.forEach(u => {
                    var li = document.createElement('li');
                    li.style.display = 'flex';
                    li.style.justifyContent = 'space-between';
                    li.style.alignItems = 'center';
                    li.style.padding = '8px';
                    li.style.borderBottom = '1px solid #e2e8f0';
                    
                    var span = document.createElement('span');
                    span.innerText = `${u.username} (${u.role})`;
                    li.appendChild(span);

                    var btnDiv = document.createElement('div');
                    btnDiv.style.display = 'flex';
                    btnDiv.style.gap = '5px';

                    var resetBtn = document.createElement('button');
                    resetBtn.className = 'action-reset';
                    resetBtn.innerText = 'ይለፍ ቃል ሪሴት';
                    resetBtn.onclick = function() {
                        var newPwd = prompt(u.username + ' ለሚለው ተጠቃሚ አዲስ የይለፍ ቃል ያስገቡ:');
                        if (newPwd) {
                            fetch(API + '/users/' + u.id + '/reset-password', {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': 'Bearer ' + token
                                },
                                body: JSON.stringify({ password: newPwd })
                            })
                            .then(res => res.json())
                            .then(d => { showToast(d.message || 'የይለፍ ቃል ተቀይሯል!'); });
                        }
                    };
                    btnDiv.appendChild(resetBtn);

                    if (u.username !== currentUser) {
                        var delBtn = document.createElement('button');
                        delBtn.className = 'action-del';
                        delBtn.innerText = 'ሰርዝ';
                        delBtn.onclick = function() {
                            if (confirm(u.username + ' ተጠቃሚውን መሰረዝ ይፈልጋሉ?')) {
                                fetch(API + '/users/' + u.id, {
                                    method: 'DELETE',
                                    headers: { 'Authorization': 'Bearer ' + token }
                                })
                                .then(res => res.json())
                                .then(d => {
                                    showToast(d.message || 'ተጠቃሚው ተሰርዟል!');
                                    fetchAdminUsersList();
                                });
                            }
                        };
                        btnDiv.appendChild(delBtn);
                    }

                    li.appendChild(btnDiv);
                    userListUI.appendChild(li);
                });
            });
        }

        window.createUser = function() {
            var username = document.getElementById('newUserName').value.trim();
            var password = document.getElementById('newUserPassword').value.trim();
            var role = document.getElementById('newUserRole').value;

            if (!username || !password) {
                showToast('እባክዎ የተጠቃሚ ስም እና የይለፍ ቃል ያስገቡ!');
                return;
            }

            fetch(API + '/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ username, password, role })
            })
            .then(res => res.json().then(d => ({ ok: res.ok, data: d })))
            .then(result => {
                if (result.ok) {
                    showToast('ተጠቃሚው በተሳካ ሁኔታ ተፈጥሯል!');
                    document.getElementById('newUserName').value = '';
                    document.getElementById('newUserPassword').value = '';
                    fetchAdminUsersList();
                } else {
                    showToast(result.data.error || 'ተጠቃሚ መፍጠር አልተቻለም!');
                }
            });
        };

        window.submitChangePassword = function() {
            var oldPassword = document.getElementById('oldSuperPwd').value.trim();
            var newPassword = document.getElementById('newSuperPwd').value.trim();

            if (!oldPassword || !newPassword) {
                showToast('እባክዎ የድሮውን እና አዲሱን የይለፍ ቃል ይሙሉ!');
                return;
            }

            fetch(API + '/change-password', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ oldPassword, newPassword })
            })
            .then(res => res.json().then(d => ({ ok: res.ok, data: d })))
            .then(result => {
                if (result.ok) {
                    showToast('የይለፍ ቃልዎ ተቀይሯል!');
                    document.getElementById('oldSuperPwd').value = '';
                    document.getElementById('newSuperPwd').value = '';
                } else {
                    showToast(result.data.error || 'መቀየር አልተቻለም!');
                }
            });
        };

        window.handleReportSubmit = function(e) {
            e.preventDefault();
            var reportData = {
                zone: document.getElementById('zone').value,
                poly: document.getElementById('poly').value,
                techName: document.getElementById('techName').value,
                coordinator: document.getElementById('coordinator').value,
                phone: document.getElementById('phone').value,
                sector: document.getElementById('sector').value,
                valueChain: document.getElementById('valueChain').value,
                techType: document.getElementById('techType').value,
                year: document.getElementById('year').value,
                transferQty: document.getElementById('transferQty').value,
                transferSector: document.getElementById('transferSector').value,
                resource: document.getElementById('resource').value,
                b_ent: document.getElementById('b_ent').value,
                b_mobile: document.getElementById('b_mobile').value,
                b_male: document.getElementById('b_male').value,
                b_female: document.getElementById('b_female').value,
                diagnosis: document.getElementById('diagnosis').value
            };

            fetch(API + '/reports', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(reportData)
            })
            .then(res => res.json().then(d => ({ ok: res.ok, data: d })))
            .then(result => {
                if (result.ok) {
                    showToast('ሪፖርቱ በተሳካ ሁኔታ ተመዝግቧል!');
                    document.getElementById('reportForm').reset();
                    if(userRole === 'user') document.getElementById('zone').value = currentUser;
                    loadReports();
                } else {
                    showToast(result.data.error || 'ሪፖርት መመዝገብ አልተቻለም!');
                }
            });
        };

        function loadReports() {
            fetch(API + '/reports', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(reports => {
                var tbody = document.getElementById('reportTableBody');
                tbody.innerHTML = '';
                if (!reports || reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="19" style="text-align:center; color:#64748b;">ምንም ሪፖርት አልተገኘም</td></tr>';
                    return;
                }
                reports.forEach(r => {
                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + escapeHtml(r.zone || '') + '</td>' +
                        '<td>' + escapeHtml(r.poly || '') + '</td>' +
                        '<td>' + escapeHtml(r.techName || '') + '</td>' +
                        '<td>' + escapeHtml(r.coordinator || '') + '</td>' +
                        '<td>' + escapeHtml(r.phone || '') + '</td>' +
                        '<td>' + escapeHtml(r.sector || '') + '</td>' +
                        '<td>' + escapeHtml(r.valueChain || '') + '</td>' +
                        '<td>' + escapeHtml(r.techType || '') + '</td>' +
                        '<td>' + escapeHtml(String(r.year || '')) + '</td>' +
                        '<td>' + escapeHtml(String(r.transferQty || '')) + '</td>' +
                        '<td>' + escapeHtml(r.transferSector || '') + '</td>' +
                        '<td>' + escapeHtml(String(r.resource || '')) + '</td>' +
                        '<td>' + escapeHtml(String(r.b_ent || '')) + '</td>' +
                        '<td>' + escapeHtml(String(r.b_mobile || '')) + '</td>' +
                        '<td>' + escapeHtml(String(r.b_male || '')) + '</td>' +
                        '<td>' + escapeHtml(String(r.b_female || '')) + '</td>' +
                        '<td>' + escapeHtml(String(r.diagnosis || '')) + '</td>' +
                        '<td>' + escapeHtml(r.createdBy || '') + '</td>' +
                        '<td>';
                    
                    if (userRole === 'superadmin' || userRole === 'admin' || r.createdBy === currentUser) {
                        tr.innerHTML += '<button class="action-del" onclick="deleteReport(\'' + r.id + '\')">ሰርዝ</button>';
                    }
                    tr.innerHTML += '</td>';
                    tbody.appendChild(tr);
                });
            });
        }

        window.deleteReport = function(id) {
            if (confirm('ይህንን ሪፖርት መሰረዝ ይፈልጋሉ?')) {
                fetch(API + '/reports/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                .then(res => res.json())
                .then(d => {
                    showToast(d.message || 'ሪፖርቱ ተሰርዟል!');
                    loadReports();
                });
            }
        };

        window.exportTableToExcel = function() {
            var table = document.getElementById('reportTable');
            var wb = XLSX.utils.table_to_book(table, { sheet: "የቴክኖሎጂ ሽግግር ሪፖርት" });
            XLSX.writeFile(wb, "Tech_Transfer_Report.xlsx");
        };
    </script>
</body>
</html>
